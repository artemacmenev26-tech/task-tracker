<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Простой трекер задач с сохранением данных в браузере">
    <title>Task Tracker — трекер задач</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <p class="eyebrow">Учебный проект</p>
        <h1>Трекер задач</h1>
        <p class="description">Добавляйте задачи, отмечайте выполненные и удаляйте ненужные.</p>

        <div class="task-form">
            <label class="visually-hidden" for="taskInput">Новая задача</label>
            <input id="taskInput" type="text" placeholder="Например, изучить массивы" autocomplete="off">
            <button id="addButton" type="button">Добавить</button>
        </div>

        <p class="hint">Нажмите на задачу, чтобы отметить её выполненной.</p>
        <p id="taskCount">Осталось задач: 0</p>
        <div class="filters">
            <button class="filter-button active" data-filter="all">Все</button>
            <button class="filter-button" data-filter="active">Активные</button>
            <button class="filter-button" data-filter="completed">Выполненные</button>
        </div>
        <button class="clear-completed-button" id="clearCompletedButton" type="button">Удалить выполненные</button>
        <ul id="taskList" aria-live="polite"></ul>
    </main>
    <script src="script.js"></script>
</body>
</html>
