<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Простой трекер задач с сохранением данных в браузере">
    <title>Task Tracker — трекер задач</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <h1>Трекер задач</h1>
        <p class="description">Добавляйте задачи, отмечайте выполненные и удаляйте ненужные.</p>

        <form class="task-form">
            <label class="visually-hidden" for="taskInput">Новая задача</label>
            <input id="taskInput" type="text" placeholder="Добавить задачу" autocomplete="off">
            <label class="visually-hidden" for="taskPrioritySelect">Приоритет задачи</label>
            <select id="taskPrioritySelect">
                <option value="low">Низкий</option>
                <option value="normal" selected>Обычный</option>
                <option value="high">Высокий</option>
            </select>
            <button id="addButton" type="submit">Добавить</button>
        </form>
        <div class="task-search">
            <label for="taskSearchInput" class="visually-hidden">Поиск задач</label>
            <input id="taskSearchInput" type="search" placeholder="Найти задачу" autocomplete="off">
        </div>
        <div class="task-sorting">
            <label for="taskSortSelect">Сортировка:</label>
            <select id="taskSortSelect">
                <option value="newest">Сначала новые</option>
                <option value="oldest">Сначала старые</option>
            </select>
        </div>
        <p class="hint">Нажмите на задачу, чтобы отметить её выполненной.</p>
        <p id="taskCount">Осталось задач: 0</p>
        <div class="filters">
            <button class="filter-button active" data-filter="all" aria-pressed="true">Все</button>
            <button class="filter-button" data-filter="active" aria-pressed="false">Активные</button>
            <button class="filter-button" data-filter="completed" aria-pressed="false">Выполненные</button>
        </div>
        <button class="clear-completed-button" id="clearCompletedButton" type="button">Удалить выполненные</button>
        <ul id="taskList" aria-live="polite"></ul>
    </main>
    <script src="script.js"></script>
</body>
</html>
